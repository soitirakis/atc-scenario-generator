name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests with coverage (85% minimum on src/sim.js and src/scenario.js)
        run: npm run test:coverage
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop + phone)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
      - name: Upload single-file build
        uses: actions/upload-artifact@v7
        with:
          name: atc-scenario-generator
          path: dist/index.html
      # the build step of the end-to-end tests empties dist/, so the badge is written after it
      - name: Coverage badge
        run: node scripts/coverage-badge.mjs coverage/coverage-summary.json dist/coverage.json
      # the same dist/index.html the end-to-end tests ran against, plus the coverage badge
      - name: Package site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
